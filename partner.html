<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#075ea8"><link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png"><link rel="apple-touch-icon" href="/apple-touch-icon.png"><title>Gossip BH Partner</title><style>
@import url('https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&display=swap');:root{--blue:#0868b8;--deep:#074d88;--soft:#e9f3fb;--ink:#15202b;--muted:#667684;--line:rgba(13,61,96,.12);--ok:#14805e;--bad:#bb2d3b}*{box-sizing:border-box}body{margin:0;background:#f6f9fb;color:var(--ink);font:15px/1.5 Manrope,sans-serif;-webkit-font-smoothing:antialiased}.shell{max-width:620px;margin:auto;min-height:100dvh;background:#fff;border-inline:1px solid var(--line)}header{padding:20px 22px;display:flex;align-items:center;gap:11px;border-bottom:1px solid var(--line)}.mark{width:43px;height:43px;border-radius:13px;background:linear-gradient(90deg,#fff 50%,var(--blue) 50%);box-shadow:inset 0 0 0 2px var(--blue);display:grid;place-items:center;color:var(--blue);font-size:27px;font-weight:800}header b{letter-spacing:.12em}header small{display:block;color:var(--muted);letter-spacing:0}.page{padding:24px}.page h1{font-size:28px;letter-spacing:-.04em;margin:0 0 6px}.page>p{color:var(--muted);margin:0 0 24px}.panel{padding:20px;border-radius:14px;box-shadow:0 0 0 1px rgba(10,54,86,.05),0 8px 25px rgba(14,62,96,.07);margin-bottom:16px}label{display:block;font-size:12px;font-weight:700;margin:13px 0 6px}input{width:100%;font:inherit;border:1px solid var(--line);background:#f3f6f8;border-radius:8px;padding:12px;color:var(--ink);font-size:16px}button{min-height:44px;border:0;border-radius:8px;padding:0 16px;font:700 14px Manrope;cursor:pointer}.primary{background:var(--blue);color:#fff;width:100%;margin-top:16px}.quiet{background:#fff;color:var(--ink);border:1px solid var(--line)}.top{display:flex;justify-content:space-between;align-items:center;gap:12px}.result{padding:22px;border-radius:14px;text-align:center;background:var(--soft);margin:16px 0}.result.good{background:#e8f6f0;color:#0d684c}.result.bad{background:#faecee;color:#8a2130}.result strong{display:block;font-size:22px}.history{display:grid}.row{padding:14px 0;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:12px}.row small{color:var(--muted)}[hidden]{display:none!important}.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#142532;color:#fff;padding:11px 15px;border-radius:9px;display:none}.toast.on{display:block}@media(max-width:650px){.shell{border:0}.page{padding:18px}}
</style></head><body><div class="shell"><header><div class="mark">G</div><div><b>GOSSIP</b><small>Partner verification</small></div></header><main class="page"><section id="login"><h1>Partner sign in</h1><p>Securely validate student offer QR codes for your business.</p><div class="panel"><label>Email<input id="email" type="email" autocomplete="email"></label><label>Password<input id="password" type="password" autocomplete="current-password"></label><button class="primary" id="sign-in">Sign in</button></div></section><section id="portal" hidden><div class="top"><div><h1 id="name">Partner portal</h1><p>Validate each one-time offer before providing it.</p></div><button class="quiet" id="logout">Sign out</button></div><div class="panel"><label>QR validation code or link<input id="code" autocomplete="off" placeholder="Paste the scanned link"></label><button class="primary" id="check">Check offer</button><div id="result"></div></div><div class="panel"><h2>Recent redemptions</h2><div id="history" class="history"></div></div></section></main></div><div id="toast" class="toast" role="status"></div><script>
const $=s=>document.querySelector(s),toast=m=>{const t=$('#toast');t.textContent=m;t.classList.add('on');setTimeout(()=>t.classList.remove('on'),3000)},esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function api(url,o={}){const r=await fetch(url,{credentials:'same-origin',...o});let d={};try{d=await r.json()}catch{}if(!r.ok)throw new Error(d.error||'Request failed.');return d}const send=(u,d)=>api(u,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(d)});function raw(){const v=$('#code').value.trim();try{return new URL(v).searchParams.get('redeem')||v}catch{return v}}async function history(){const d=await api('/api/partner/history');$('#history').innerHTML=d.redemptions.length?d.redemptions.map(x=>`<div class="row"><b>${esc(x.title)}</b><small>${new Intl.DateTimeFormat('en-BH',{dateStyle:'medium',timeStyle:'short'}).format(new Date(x.redeemed_at*1000))}</small></div>`).join(''):'<p>No redeemed offers yet.</p>'}async function open(){try{const d=await api('/api/partner/session');$('#login').hidden=true;$('#portal').hidden=false;$('#name').textContent=d.partner.name;await history();const token=new URLSearchParams(location.search).get('redeem');if(token){$('#code').value=token;check()}}catch{$('#login').hidden=false;$('#portal').hidden=true}}async function check(){const t=raw();if(!t)return toast('Scan or paste an offer code.');try{const d=await api('/api/partner/validate?token='+encodeURIComponent(t)),c=d.claim;$('#result').innerHTML=`<div class="result ${c.valid?'good':'bad'}"><strong>${c.valid?'Valid student offer':c.redeemed_at?'Already redeemed':'Expired'}</strong><span>${esc(c.title)}</span>${c.valid?'<button class="primary" id="redeem">Redeem once</button>':''}</div>`;$('#redeem')?.addEventListener('click',async()=>{try{await send('/api/partner/redeem',{token:t});toast('Offer redeemed successfully.');check();history()}catch(e){toast(e.message)}})}catch(e){$('#result').innerHTML=`<div class="result bad"><strong>Not valid</strong><span>${esc(e.message)}</span></div>`}}$('#sign-in').onclick=async()=>{try{await send('/api/partner/login',{email:$('#email').value,password:$('#password').value});open()}catch(e){toast(e.message)}};$('#check').onclick=check;$('#logout').onclick=async()=>{await send('/api/partner/logout',{});location.reload()};open();
</script></body></html>
