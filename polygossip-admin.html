<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#d84c83"><title>PolyGossip</title><link rel="icon" href="/favicon-32.png"><style>
:root{--pink:#d84c83;--deep:#8f2855;--soft:#fff0f6;--ink:#171219;--muted:#6c5b63;--line:#eadde3;--paper:#fff;--canvas:#fff9fb}*{box-sizing:border-box}body{margin:0;background:var(--canvas);color:var(--ink);font:15px/1.55 Manrope,system-ui,sans-serif}button,input,textarea{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid #efb2ca;outline-offset:2px}::selection{background:#f4bfd4;color:#4f142d}.shell{max-width:820px;margin:auto;min-height:100dvh}.top{display:flex;align-items:center;justify-content:space-between;padding:20px 22px;background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}.identity{display:flex;align-items:center;gap:12px}.identity img{width:48px;height:48px;border-radius:50%;object-fit:cover}.identity h1{font-size:22px;line-height:1;margin:0}.identity span{display:block;color:var(--muted);font-size:12px;margin-top:5px}.button{border:0;border-radius:10px;min-height:43px;padding:0 17px;background:var(--pink);color:#fff;font-weight:800}.button.secondary{background:var(--soft);color:var(--deep)}main{padding:24px 20px 50px}.intro{display:flex;align-items:end;justify-content:space-between;gap:18px;margin-bottom:22px}.intro h2{font-size:30px;letter-spacing:-.03em;margin:0}.intro p{margin:5px 0 0;color:var(--muted)}.filters{display:flex;gap:8px}.filters button{border:1px solid var(--line);border-radius:9px;background:#fff;color:var(--muted);min-height:40px;padding:0 14px;font-weight:750}.filters button.active{background:var(--ink);border-color:var(--ink);color:#fff}.inbox{display:grid;gap:14px}.message{background:#fff;border:1px solid var(--line);border-radius:15px;padding:18px}.meta{display:flex;justify-content:space-between;gap:10px;color:var(--muted);font-size:12px}.message-body{font-size:17px;white-space:pre-wrap;margin:16px 0}.media{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin:12px 0}.media img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:10px}.reply-box{display:grid;gap:9px;margin-top:15px;padding-top:15px;border-top:1px solid var(--line)}textarea,input{width:100%;border:1px solid #d7c7ce;border-radius:10px;background:#fff;padding:12px;color:var(--ink)}textarea{min-height:105px;resize:vertical}.published{background:var(--soft);border-radius:11px;padding:13px;margin-top:12px}.public-replies{margin-top:15px}.public-reply{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0;border-top:1px solid var(--line)}.public-reply p{margin:0}.remove{border:0;background:#fff0f0;color:#a12635;border-radius:8px;padding:7px 10px;font-weight:750}.empty{padding:65px 20px;text-align:center;color:var(--muted)}.gate{position:fixed;inset:0;z-index:20;background:#181217;display:grid;place-items:center;padding:22px}.gate-card{width:min(430px,100%);background:#fff;border-radius:16px;padding:27px}.gate-brand{display:flex;align-items:center;gap:11px;margin-bottom:24px}.gate-brand img{width:55px;height:55px;border-radius:50%;object-fit:cover}.gate h2{font-size:28px;margin:0}.gate p{color:var(--muted);margin:8px 0 20px}.gate label{display:block;font-size:12px;font-weight:800;margin:13px 0 6px}.gate .button{width:100%;margin-top:17px}.error{color:#a12635;min-height:22px;margin-top:10px;font-size:13px}.hidden{display:none!important}.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#171219;color:#fff;padding:11px 16px;border-radius:10px;display:none;z-index:30}.toast.show{display:block}@media(max-width:620px){.top{padding:15px}.identity span{display:none}main{padding:20px 14px}.intro{align-items:stretch;flex-direction:column}.filters{width:100%}.filters button{flex:1}.message{padding:15px}.media{grid-template-columns:repeat(2,1fr)}}
</style></head><body><div class="shell"><header class="top"><div class="identity"><img src="/poly-gossip-identity.jpg" alt="PolyGossip"><div><h1>PolyGossip</h1><span>Private admin inbox</span></div></div><button class="button secondary" id="account-button">Sign in</button></header><main><div class="intro"><div><h2>Messages</h2><p>Reply once, publish, and manage the public conversation.</p></div><div class="filters"><button class="active" data-status="pending">Pending</button><button data-status="published">Published</button></div></div><section class="inbox" id="inbox"><div class="empty">Sign in to open the inbox.</div></section></main></div>
<section class="gate" id="gate"><form class="gate-card" id="login-form"><div class="gate-brand"><img src="/poly-gossip-identity.jpg" alt="PolyGossip"><h2>Admin sign in</h2></div><p>Only approved PolyGossip admins can access and reply to messages.</p><label for="email">Email</label><input id="email" type="email" autocomplete="username" required><label for="password">Password</label><input id="password" type="password" autocomplete="current-password" required><button class="button" id="sign-in" type="submit">Sign in</button><div class="error" id="login-error"></div></form></section><div class="toast" id="toast"></div>
<script>
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)],esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let current='pending';const time=v=>new Date(Number(v)*1000).toLocaleString('en-BH',{dateStyle:'medium',timeStyle:'short'});async function api(url,options={}){const r=await fetch(url,{credentials:'include',...options}),d=await r.json().catch(()=>({}));if(!r.ok)throw Object.assign(new Error(d.error||'Something went wrong.'),{status:r.status});return d}function toast(t){$('#toast').textContent=t;$('#toast').classList.add('show');setTimeout(()=>$('#toast').classList.remove('show'),2400)}
function render(messages){$('#inbox').innerHTML=messages.length?messages.map(g=>`<article class="message"><div class="meta"><span>${esc(g.sender_email)} · ${time(g.created_at)}</span><span>${esc(g.status)}</span></div><div class="message-body">${esc(g.body)}</div>${g.media?.length?`<div class="media">${g.media.map(m=>`<a href="${esc(m.url)}" target="_blank" rel="noopener"><img src="${esc(m.url)}" alt="Message attachment"></a>`).join('')}</div>`:''}${current==='pending'?`<div class="reply-box"><textarea id="reply-${esc(g.id)}" placeholder="Write the PolyGossip reply…"></textarea><button class="button" data-publish="${esc(g.id)}">Reply and publish</button></div>`:`<div class="published"><b>PolyGossip replied</b><div>${esc(g.reply_body||'')}</div></div>${g.replies?.length?`<div class="public-replies"><b>Public replies · ${g.replies.length}</b>${g.replies.map(r=>`<div class="public-reply"><p>${r.sticker?`[${esc(r.sticker)}] `:''}${esc(r.body||'Sticker reply')}</p><button class="remove" data-remove="${esc(r.id)}">Remove</button></div>`).join('')}</div>`:''}`}</article>`).join(''):`<div class="empty">No ${current} messages.</div>`;$$('[data-publish]').forEach(b=>b.onclick=async()=>{b.disabled=true;try{await api('/api/admin/gossip/'+encodeURIComponent(b.dataset.publish),{method:'PATCH',headers:{'content-type':'application/json'},body:JSON.stringify({reply:$('#reply-'+b.dataset.publish).value})});toast('Reply published');load()}catch(e){toast(e.message);b.disabled=false}});$$('[data-remove]').forEach(b=>b.onclick=async()=>{await api('/api/admin/gossip-replies/'+encodeURIComponent(b.dataset.remove),{method:'DELETE'});toast('Reply removed');load()})}
async function load(){try{const d=await api('/api/admin/gossip?status='+current);render(d.messages)}catch(e){if(e.status===401||e.status===403){$('#gate').classList.remove('hidden');$('#login-error').textContent=e.status===403?'This account is not an approved admin.':''}else toast(e.message)}}async function session(){try{await api('/api/admin/overview');$('#gate').classList.add('hidden');$('#account-button').textContent='Sign out';$('#account-button').dataset.signed='1';await load()}catch{$('#gate').classList.remove('hidden')}}
$('#login-form').onsubmit=async e=>{e.preventDefault();const b=$('#sign-in');b.disabled=true;$('#login-error').textContent='';try{await api('/api/auth/login',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({email:$('#email').value,password:$('#password').value})});await session()}catch(err){$('#login-error').textContent=err.message}finally{b.disabled=false}};$('#account-button').onclick=async()=>{if(!$('#account-button').dataset.signed)return $('#gate').classList.remove('hidden');await api('/api/auth/logout',{method:'POST',headers:{'content-type':'application/json'},body:'{}'}).catch(()=>{});location.reload()};$$('[data-status]').forEach(b=>b.onclick=()=>{$$('[data-status]').forEach(x=>x.classList.toggle('active',x===b));current=b.dataset.status;load()});session();
</script></body></html>
